name: Security audit

# Runs pip-audit weekly against the installed runtime + extras.
# Decoupled from CI so transient CVE disclosures do not block PR merges
# — security findings open issues via the action itself.

on:
  schedule:
    - cron: "17 4 * * 1"  # Monday 04:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + all extras
        run: |
          pip install -e ".[dev,all]"
          pip install pip-audit

      - name: Run pip-audit (report)
        # Always write the JSON report so the artifact upload below has
        # something to publish even when the strict gate fails.
        # --skip-editable: we install veridian-ai itself via `pip install -e`,
        # and pip-audit cannot resolve editable installs against PyPI.
        if: always()
        run: |
          pip-audit --skip-editable --format json --output pip-audit.json || true

      - name: Run pip-audit (advisory on PR)
        # PR runs report findings but do not block: third-party CVE
        # disclosures should not gate unrelated feature work on the
        # release cadence of an upstream dep.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pip-audit --skip-editable

      - name: Run pip-audit (strict on schedule)
        # Scheduled and manual runs fail loudly when CVEs surface so the
        # weekly summary email / failed run is the operator's signal.
        if: github.event_name != 'pull_request'
        run: pip-audit --skip-editable --strict

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json
          retention-days: 30
