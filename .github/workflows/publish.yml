name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: pypi
      url: https://pypi.org/project/veridian-ai/

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # Match CI: install all runtime extras so the publish quality
        # gates exercise the full test surface.
        run: |
          pip install build twine
          pip install -e ".[dev,all]"

      - name: Quality gates
        run: |
          ruff check veridian tests examples
          ruff format --check veridian tests examples
          mypy veridian --strict
          pytest --cov=veridian --cov-fail-under=85 --tb=short -q

      - name: Build package
        run: python -m build

      - name: Check artifacts
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
