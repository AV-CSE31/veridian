name: "Chit Verify"
description: "Run Chit verification against agent outputs. Blocks merge on verification failure."
author: "Chit contributors"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  verifier:
    description: "Registered verifier ID to run (e.g. schema, repo_guard, bash_exit)"
    required: false
    default: "schema"

  verifier-config:
    description: "Verifier constructor configuration as a JSON object"
    required: false
    default: '{"schema":{"type":"object","required":["output"],"properties":{"output":{"type":"string","minLength":1}}}}'

  agent-output:
    description: "The agent output text to verify"
    required: false
    default: ""

  task:
    description: "Task description (used for verifier context)"
    required: false
    default: "Agent output verification"

  fail-on-error:
    description: "Exit with status 1 when verification fails (set to false to continue)"
    required: false
    default: "true"

  output-path:
    description: "Path to write the JSON verification result file"
    required: false
    default: "chit_action_result.json"

  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"

outputs:
  passed:
    description: "Whether verification passed (true/false)"
    value: ${{ steps.verify.outputs.passed }}

  error:
    description: "Verification error message if failed, empty string if passed"
    value: ${{ steps.verify.outputs.error }}

  result-path:
    description: "Path to the JSON result file"
    value: ${{ inputs.output-path }}

runs:
  using: "composite"
  steps:
    - name: "Set up Python"
      uses: "actions/setup-python@v6"
      with:
        python-version: ${{ inputs.python-version }}

    - name: "Install Chit"
      shell: bash
      run: |
        python -m pip install --quiet "${{ github.action_path }}/../../.."

    - name: "Run Verification"
      id: verify
      shell: bash
      env:
        CHIT_VERIFIER: ${{ inputs.verifier }}
        CHIT_VERIFIER_CONFIG: ${{ inputs.verifier-config }}
        CHIT_AGENT_OUTPUT: ${{ inputs.agent-output }}
        CHIT_TASK: ${{ inputs.task }}
        CHIT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        CHIT_OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        FAIL_FLAG=()
        if [[ "${CHIT_FAIL_ON_ERROR,,}" == "false" ]]; then
          FAIL_FLAG+=(--no-fail-on-error)
        fi

        set +e
        chit verify \
          --verifier "$CHIT_VERIFIER" \
          --verifier-config "$CHIT_VERIFIER_CONFIG" \
          --agent-output "$CHIT_AGENT_OUTPUT" \
          --task "$CHIT_TASK" \
          --output-path "$CHIT_OUTPUT_PATH" \
          "${FAIL_FLAG[@]}"
        STATUS=$?
        set -e

        python - <<'PY'
        import json
        import os
        import uuid

        with open(os.environ["CHIT_OUTPUT_PATH"], encoding="utf-8") as handle:
            result = json.load(handle)

        delimiter = f"CHIT_{uuid.uuid4().hex}"
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"passed={str(bool(result['passed'])).lower()}\n")
            handle.write(f"error<<{delimiter}\n{result.get('error') or ''}\n{delimiter}\n")
        PY

        exit "$STATUS"
