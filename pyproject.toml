[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veridian-ai"
version = "0.4.0"
description = "Deterministic verification and replay-safe runtime for production AI agent workflows."
authors = [{ name = "Veridian contributors" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "llm",
    "verification",
    "deterministic-ai",
    "replay",
    "reliability",
    "agent-safety",
    "production",
    "runtime",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

dependencies = [
    # Cross-process file locking for atomic ledger writes
    "filelock>=3.13",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.55.0",
    "tenacity>=9.0",
    "tiktoken>=0.7",
]
pdf = [
    "pypdf>=4.3",
]
http = [
    "httpx>=0.27",
]
pydantic = [
    "pydantic>=2.5",
]
dev = [
    "build>=1.2",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "twine>=5.1",
]
all = ["veridian-ai[http,llm,pdf,pydantic]"]

# Third-party verifiers auto-discovered at import time via this entry point.
# In your package's pyproject.toml:
#   [project.entry-points."veridian.verifiers"]
#   my_verifier = "my_package.verifiers:MyVerifier"
[project.entry-points."veridian.verifiers"]
bash_exit = "veridian.verify.builtin.bash:BashExitCodeVerifier"
quote_match = "veridian.verify.builtin.quote:QuoteMatchVerifier"
schema = "veridian.verify.builtin.schema:SchemaVerifier"
http_status = "veridian.verify.builtin.http:HttpStatusVerifier"
file_exists = "veridian.verify.builtin.file_exists:FileExistsVerifier"
composite = "veridian.verify.builtin.composite:CompositeVerifier"
any_of = "veridian.verify.builtin.any_of:AnyOfVerifier"

[tool.hatch.build]
exclude = [
    "/.claude",
    "/docs",
    "/guides",
    "/planning",
    "/research",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/ONBOARDING.md",
    "/GEMINI.md",
    "/ARCHITECTURE.md",
    "/CODEBASE_HEALTH.md",
    "/SESSION_HANDOFF.md",
]

[tool.hatch.build.targets.wheel]
packages = ["veridian"]

[project.urls]
Homepage = "https://github.com/AV-CSE31/veridian"
Repository = "https://github.com/AV-CSE31/veridian"
Changelog = "https://github.com/AV-CSE31/veridian/releases"
"Bug Tracker" = "https://github.com/AV-CSE31/veridian/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q --import-mode=importlib"

[tool.hatch.version]
path = "veridian/__init__.py"

[tool.coverage.run]
source = ["veridian"]
omit = [
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
