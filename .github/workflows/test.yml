name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            extras: "dev"
            primary: true
          - os: ubuntu-latest
            python-version: "3.12"
            extras: "dev,all"
            primary: false
          - os: ubuntu-latest
            python-version: "3.13"
            extras: "dev"
            primary: false
          - os: windows-latest
            python-version: "3.11"
            extras: "dev"
            primary: false
          - os: macos-latest
            python-version: "3.12"
            extras: "dev"
            primary: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[${{ matrix.extras }}]"

      - name: Lint
        run: ruff check veridian tests examples

      - name: Format
        run: ruff format --check veridian tests examples

      - name: Type check
        run: mypy veridian --strict

      - name: Tests
        run: pytest -q --tb=short

      - name: Coverage
        if: matrix.primary
        run: pytest --cov=veridian --cov-report=term-missing --cov-fail-under=85 -q

      - name: Build package
        if: matrix.primary
        run: python -m build

      - name: Check artifacts
        if: matrix.primary
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist/*

      - name: Check protected paths
        if: matrix.primary
        run: python scripts/check_protected_paths.py --mode tracked

  minimal-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and install base wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
      - name: Smoke-test installed interfaces
        run: |
          python -c "import veridian, veridian.assurance, veridian.effects, veridian.math"
          veridian --help
