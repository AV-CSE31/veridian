name: Release parity

# The repository advanced from 0.1.0 to 0.4.0 while PyPI still served 0.1.0, and
# nothing reported it for four months. This job is that missing signal: a red
# check whenever the newest tag and the published version diverge.

on:
  schedule:
    # 07:00 UTC daily. A divergence is caught within a day, not a quarter.
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are the whole point of this check.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compare newest tag against PyPI latest
        run: python scripts/check_release_parity.py
