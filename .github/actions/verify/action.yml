name: "Veridian Verify"
description: "Run Veridian verification against agent outputs. Blocks merge on verification failure."
author: "Veridian contributors"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  verifier:
    description: "Registered verifier ID to run (e.g. schema, repo_guard, bash_exit)"
    required: false
    default: "schema"

  verifier-config:
    description: "Verifier constructor configuration as a JSON object"
    required: false
    default: '{"schema":{"type":"object","required":["output"],"properties":{"output":{"type":"string","minLength":1}}}}'

  agent-output:
    description: "The agent output text to verify"
    required: false
    default: ""

  task:
    description: "Task description (used for verifier context)"
    required: false
    default: "Agent output verification"

  fail-on-error:
    description: "Exit with status 1 when verification fails (set to false to continue)"
    required: false
    default: "true"

  output-path:
    description: "Path to write the JSON verification result file"
    required: false
    default: "veridian_action_result.json"

  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"

outputs:
  passed:
    description: "Whether verification passed (true/false)"
    value: ${{ steps.verify.outputs.passed }}

  error:
    description: "Verification error message if failed, empty string if passed"
    value: ${{ steps.verify.outputs.error }}

  result-path:
    description: "Path to the JSON result file"
    value: ${{ inputs.output-path }}

runs:
  using: "composite"
  steps:
    - name: "Set up Python"
      uses: "actions/setup-python@v5"
      with:
        python-version: ${{ inputs.python-version }}

    - name: "Install Veridian"
      shell: bash
      run: |
        python -m pip install --quiet "${{ github.action_path }}/../../.."

    - name: "Run Verification"
      id: verify
      shell: bash
      env:
        VERIDIAN_VERIFIER: ${{ inputs.verifier }}
        VERIDIAN_VERIFIER_CONFIG: ${{ inputs.verifier-config }}
        VERIDIAN_AGENT_OUTPUT: ${{ inputs.agent-output }}
        VERIDIAN_TASK: ${{ inputs.task }}
        VERIDIAN_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        VERIDIAN_OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        FAIL_FLAG=()
        if [[ "${VERIDIAN_FAIL_ON_ERROR,,}" == "false" ]]; then
          FAIL_FLAG+=(--no-fail-on-error)
        fi

        set +e
        veridian verify \
          --verifier "$VERIDIAN_VERIFIER" \
          --verifier-config "$VERIDIAN_VERIFIER_CONFIG" \
          --agent-output "$VERIDIAN_AGENT_OUTPUT" \
          --task "$VERIDIAN_TASK" \
          --output-path "$VERIDIAN_OUTPUT_PATH" \
          "${FAIL_FLAG[@]}"
        STATUS=$?
        set -e

        python - <<'PY'
        import json
        import os
        import uuid

        with open(os.environ["VERIDIAN_OUTPUT_PATH"], encoding="utf-8") as handle:
            result = json.load(handle)

        delimiter = f"VERIDIAN_{uuid.uuid4().hex}"
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"passed={str(bool(result['passed'])).lower()}\n")
            handle.write(f"error<<{delimiter}\n{result.get('error') or ''}\n{delimiter}\n")
        PY

        exit "$STATUS"
