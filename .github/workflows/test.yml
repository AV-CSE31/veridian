name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check veridian tests examples

      - name: Format
        run: ruff format --check veridian tests examples

      - name: Type check
        run: mypy veridian --strict

      - name: Tests
        run: pytest --cov=veridian --cov-report=term-missing --cov-report=xml --cov-fail-under=85 --junitxml=pytest-report.xml --tb=short -q

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: |
            pytest-report.xml
            coverage.xml
          retention-days: 14

      - name: Build package
        run: python -m build

      - name: Check artifacts
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist/*

      - name: Smoke install built wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet dist/*.whl
          /tmp/smoke-venv/bin/python -c "import veridian; assert veridian.VeridianRunner, 'public API missing'"
