name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: pypi
      url: https://pypi.org/project/veridian-ai/

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # Match CI: install all runtime extras so the publish quality
        # gates exercise the full test surface.
        run: |
          pip install build twine
          pip install -e ".[dev,all]"

      - name: Quality gates
        run: |
          ruff check veridian tests examples
          ruff format --check veridian tests examples
          mypy veridian --strict
          pytest --cov=veridian --cov-fail-under=85 --tb=short -q

      - name: Build package
        run: python -m build

      - name: Check artifacts
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist/*

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install --quiet cyclonedx-bom
          mkdir -p dist
          cyclonedx-py environment --of JSON --output-reproducible -o dist/sbom.cdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
          retention-days: 90

      # Trusted publishing (PEP 740 / OIDC). The job-level id-token: write
      # permission lets pypa/gh-action-pypi-publish exchange a GitHub OIDC
      # token for a short-lived PyPI credential — no long-lived
      # PYPI_API_TOKEN secret required. Pinned to a commit SHA so a tag
      # rewrite on the action repo cannot silently change what runs with
      # publish authority.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
